# yaml-language-server: $schema=../../node_modules/@lernapps/app-templates/runtime/explainer/explainer.v2.schema.json
title:
  de: Verzerrte Trainingsdaten
  en: Skewed training data
description:
  de: "Einseitige Trainingsdaten führen zu immer gleichen Fehlern: den Fehler in den Daten finden."
  en: "One-sided training data leads to the same mistakes again and again: finding the fault in the data."
competencies: [trainingsdaten]
blocks:
  - type: section
    id: einstieg
    title:
      de: "Im Chat der 9b: Die Maschine irrt"
      en: "In the 9B chat: the machine gets it wrong"
    blocks:
      - type: text
        text:
          de: |
            Jona, Selin und Mia sind jetzt 14 und in der Klasse 9b. Das Tierheim hat inzwischen eine eigene Maschine,
            die nach dem Verfahren „nächster Nachbar“ arbeitet. Ein Helfer hat ihren Trainingsbeutel gefüllt.

            **Selin:** Das Tierheim schreibt uns: Die Maschine hält Krümel für eine Katze. Otto auch!

            **Jona:** Ist das Programm kaputt? Es ist dasselbe wie unser Beutel-Programm aus der 6. Klasse.

            **Mia:** Der Helfer hat Fotos von der Katzenstation und aus der Hundeschule genommen. Hier ist der Beutel.

            Auf dieser Seite findest du heraus, woher die Fehler kommen und wie man sie behebt.
          en: |
            Jona, Selin and Mia are now 14 and in class 9B. The animal shelter now has its own machine, which uses the
            “nearest neighbour” method. A volunteer filled its training bag.

            **Selin:** The shelter has messaged us: the machine thinks Krümel is a cat. Otto too!

            **Jona:** Is the program broken? It's the same as our bag program from Year 7.

            **Mia:** The volunteer used photos from the cat ward and from the dog school. Here is the bag.

            On this page you find out where the mistakes come from and how to fix them.
      - type: vue-component
        component: Tierkarten
        props:
          tiere: { data: tiere }
          nummern: [1, 2, 4, 5, 6, 7]
          etikett: true
          katze: { de: Katze, en: cat }
          hund: { de: Hund, en: dog }
        nojs:
          de: |
            Die sechs Karten im Beutel des Tierheims:

            - Luna, Katze: spitze Ohren, kurze Schnauze, klein, schmale Pupillen
            - Mimi, Katze: spitze Ohren, kurze Schnauze, klein, schmale Pupillen
            - Flocke, Katze: hängende Ohren, kurze Schnauze, klein, schmale Pupillen
            - Minka, Katze: spitze Ohren, lange Schnauze, klein, schmale Pupillen
            - Bruno, Hund: hängende Ohren, lange Schnauze, groß, runde Pupillen
            - Rex, Hund: spitze Ohren, lange Schnauze, groß, runde Pupillen
          en: |
            The six cards in the shelter's bag:

            - Luna, cat: pointed ears, short snout, small, narrow pupils
            - Mimi, cat: pointed ears, short snout, small, narrow pupils
            - Flocke, cat: floppy ears, short snout, small, narrow pupils
            - Minka, cat: pointed ears, long snout, small, narrow pupils
            - Bruno, dog: floppy ears, long snout, big, round pupils
            - Rex, dog: pointed ears, long snout, big, round pupils
      - type: multiple-choice
        id: was-trennt-im-beutel
        text:
          de: Welche Merkmale trennen in diesem Beutel alle Katzen von allen Hunden?
          en: Which features separate all the cats from all the dogs in this bag?
        options:
          - text: { de: die Größe, en: size }
            correct: true
            info:
              de: Alle vier Katzen im Beutel sind klein, beide Hunde groß.
              en: All four cats in the bag are small, both dogs are big.
          - text: { de: die Pupillen, en: the pupils }
            correct: true
            info:
              de: Alle Katzen im Beutel haben schmale Pupillen, beide Hunde runde.
              en: All the cats in the bag have narrow pupils, both dogs have round ones.
          - text: { de: die Ohren, en: the ears }
            correct: false
            info:
              de: Flocke ist eine Katze mit hängenden Ohren, Rex ein Hund mit spitzen Ohren.
              en: Flocke is a cat with floppy ears, Rex is a dog with pointed ears.
          - text: { de: die Schnauze, en: the snout }
            correct: false
            info:
              de: Minka ist eine Katze mit langer Schnauze, wie die Hunde.
              en: Minka is a cat with a long snout, like the dogs.
        hint:
          de: "Geh die Merkmale einzeln durch: Haben alle Katzen denselben Wert und alle Hunde den anderen?"
          en: "Go through the features one by one: do all the cats have the same value and all the dogs the other one?"
        explanation:
          de: Ob beide auch bei neuen Tieren gelten, zeigt der nächste Abschnitt.
          en: Whether both also hold for new animals, the next section shows.
  - type: section
    id: ausprobieren
    title:
      de: "Ausprobieren: Krümel und Otto testen"
      en: "Try it: testing Krümel and Otto"
    blocks:
      - type: text
        text:
          de: |
            Unten liegt der Beutel des Tierheims. Wähle bei **Neues Tier** erst Krümel, dann Otto, und lies die Tabelle:
            Welche Karte ist jeweils am ähnlichsten, und warum? Lege dann mit **In den Beutel** Otto dazu und teste
            Krümel noch einmal.
          en: |
            Below is the shelter's bag. At **New animal**, choose Krümel first, then Otto, and read the table: which
            card is most similar each time, and why? Then use **Put in bag** to add Otto and test Krümel again.
      - type: vue-component
        component: BeutelSimulation
        props:
          tiere: { data: tiere }
          start:
            - { de: Luna, en: Luna }
            - { de: Mimi, en: Mimi }
            - { de: Flocke, en: Flocke }
            - { de: Minka, en: Minka }
            - { de: Bruno, en: Bruno }
            - { de: Rex, en: Rex }
          neu: { de: Krümel, en: Krümel }
          katze: { de: Katze, en: cat }
          hund: { de: Hund, en: dog }
          kartenTitel: { de: "Alle Tierkarten mit Etikett", en: "All animal cards with their labels" }
          beutelTitel: { de: "Im Trainingsbeutel des Tierheims", en: "In the shelter's training bag" }
          hinein: { de: In den Beutel, en: Put in bag }
          heraus: { de: Heraus, en: Take out }
          leer: { de: Der Beutel ist leer., en: The bag is empty. }
          neuTitel: { de: "Neues Tier:", en: "New animal:" }
          spalten:
            - { de: Karte im Beutel, en: Card in the bag }
            - { de: Etikett, en: Label }
            - { de: gleiche Merkmale, en: features in common }
          naechste: { de: ähnlichstes Beispiel, en: most similar example }
          antwort: { de: "Die Maschine sagt über {tier}: {antwort}.", en: "The machine says about {tier}: {antwort}." }
          weissNicht:
            de: "Die Maschine sagt: Ich weiß es nicht. Die ähnlichste Katze und der ähnlichste Hund sind {tier} gleich ähnlich."
            en: "The machine says: I don't know. The most similar cat and the most similar dog are equally similar to {tier}."
          antwortLeer:
            de: "Die Maschine sagt nichts: Ohne Beispiele im Beutel kann sie nichts vergleichen."
            en: "The machine says nothing: with no examples in the bag it cannot compare anything."
          wahrheit:
            {
              de: "Das Tierheim weiß, was {tier} wirklich ist: {sorte}.",
              en: "The shelter knows what {tier} really is: {sorte}.",
            }
          istNeu: { de: "ist gerade das neue Tier", en: "is the new animal right now" }
          zuruecksetzen: { de: Zurück zum Beutel des Tierheims, en: Back to the shelter's bag }
        nojs:
          de: |
            Mit JavaScript kannst du hier den Beutel des Tierheims ändern und neue Tiere testen. Im Beutel liegen Luna,
            Mimi, Flocke und Minka (Katzen, alle klein) sowie Bruno und Rex (Hunde, beide groß). Krümel (Hund: spitze
            Ohren, kurze Schnauze, klein, runde Pupillen) hat mit Luna und Mimi je 3 gleiche Merkmale, mit Rex 2: Die
            Maschine sagt „Katze“. Otto (Hund: hängende Ohren, kurze Schnauze, klein, runde Pupillen) hat mit Flocke 3
            gleiche Merkmale: wieder „Katze“. Legt man Otto in den Beutel, haben Luna, Mimi und Otto mit Krümel je 3
            gleiche Merkmale: Die Maschine weiß es nicht.
          en: |
            With JavaScript you can change the shelter's bag here and test new animals. The bag holds Luna, Mimi,
            Flocke and Minka (cats, all small) and Bruno and Rex (dogs, both big). Krümel (dog: pointed ears, short
            snout, small, round pupils) has 3 features in common with Luna and with Mimi, and 2 with Rex: the machine
            says “cat”. Otto (dog: floppy ears, short snout, small, round pupils) has 3 in common with Flocke: “cat”
            again. If you put Otto into the bag, Luna, Mimi and Otto each have 3 features in common with Krümel: the
            machine does not know.
      - type: single-choice
        id: warum-katze
        text:
          de: Krümel und Otto sind beide kleine Hunde. Warum sagt die Maschine bei beiden „Katze“?
          en: Krümel and Otto are both small dogs. Why does the machine say “cat” for both?
        options:
          - text: { de: "Im Beutel sind alle kleinen Tiere Katzen.", en: "In the bag, all the small animals are cats." }
            correct: true
            info:
              de: Kleine Hunde fehlen im Beutel. Darum ist eine kleine Katze am ähnlichsten.
              en: There are no small dogs in the bag. So a small cat is most similar.
          - text: { de: "Das Programm zählt die Merkmale falsch.", en: "The program counts the features wrongly." }
            correct: false
            info:
              de: Die Zahlen in der Tabelle stimmen.
              en: The numbers in the table are right.
          - text:
              { de: "Kleine Hunde sehen fast immer wie Katzen aus.", en: "Small dogs nearly always look like cats." }
            correct: false
            info:
              de: Beide haben runde Pupillen wie alle Hunde auf unseren Karten.
              en: Both have round pupils like all the dogs on our cards.
        hint:
          de: Schau, welche Karte in der Tabelle den Stern bekommt, und was diese Karten mit Krümel und Otto gemeinsam haben.
          en: Look at which card gets the star in the table, and what those cards have in common with Krümel and Otto.
        explanation:
          de: Dass im Beutel alle kleinen Tiere Katzen sind, ist ein Zufall der Auswahl. Die Maschine übernimmt ihn als Muster.
          en: That all the small animals in the bag are cats is a chance result of the choice. The machine takes it on as a pattern.
  - type: section
    id: idee
    title:
      de: "Verzerrung: Der Fehler steckt in den Daten"
      en: "Bias: the fault is in the data"
    blocks:
      - type: text
        text:
          de: |
            Das Programm ist in Ordnung. Der Beutel zeigt die Welt aber einseitig: Katzen nur klein, Hunde nur groß. Die
            Maschine findet darin ein Muster, das es bei echten Tieren nicht gibt, und macht deshalb **immer wieder
            denselben Fehler**: Kleine Hunde mit kurzer Schnauze werden zu Katzen.
          en: |
            The program is fine. But the bag shows the world in a one-sided way: cats only small, dogs only big. The
            machine finds a pattern in it that real animals do not have, and so it makes **the same mistake again and
            again**: small dogs with a short snout become cats.
      - type: definition
        term: { de: Verzerrung (Bias), en: bias }
        explanation:
          de: Die Trainingsdaten zeigen einen Ausschnitt der Welt einseitig. Das lernende System übernimmt ein Muster, das nur in den Daten gilt, und macht immer gleiche Fehler.
          en: The training data shows part of the world in a one-sided way. The learning system takes on a pattern that only holds in the data and keeps making the same mistakes.
      - type: note
        title: { de: Merke, en: Remember }
        blocks:
          - type: text
            text:
              de: Macht ein lernendes System immer wieder denselben Fehler, untersuche zuerst die Trainingsdaten. Welche Beispiele fehlen?
              en: If a learning system keeps making the same mistake, look at the training data first. Which examples are missing?
  - type: section
    id: beispiel
    title:
      de: Auch bei echten Systemen
      en: In real systems too
    blocks:
      - type: text
        text:
          de: |
            Joy Buolamwini und Timnit Gebru untersuchten 2018 drei Programme, die aus einem Foto das Geschlecht eines
            Menschen bestimmen. Zwei viel genutzte Sammlungen von Gesichtsfotos bestanden zu 79,6 % und zu 86,2 % aus
            Menschen mit heller Haut. Die Fehlerquote bei der Bestimmung des Geschlechts lag bei Frauen mit dunkler Haut
            bei bis zu 34,7 %, bei Männern mit heller Haut bei höchstens 0,8 %.
            ([Gender Shades, 2018, englisch](https://proceedings.mlr.press/v81/buolamwini18a.html))
          en: |
            In 2018, Joy Buolamwini and Timnit Gebru studied three programs that work out a person's gender from a
            photo. Two widely used collections of face photos were 79.6 % and 86.2 % made up of people with lighter
            skin. The error rate in working out the gender was up to 34.7 % for women with darker skin, and at most
            0.8 % for men with lighter skin. ([Gender Shades, 2018](https://proceedings.mlr.press/v81/buolamwini18a.html))
  - type: section
    id: uebung
    title:
      de: Übung
      en: Practice
    blocks:
      - type: true-false
        id: programm-schuld
        text:
          de: Die Maschine des Tierheims irrt bei Krümel, weil ihr Programm einen Fehler hat.
          en: The shelter's machine gets Krümel wrong because its program has a fault.
        answer: false
        hint:
          de: Dasselbe Programm hat in der 6. Klasse mit einem anderen Beutel richtig entschieden.
          en: The same program decided correctly in Year 7 with a different bag.
        explanation:
          de: Das Programm zählt richtig. Der Fehler steckt im Beutel, in dem kleine Hunde fehlen.
          en: The program counts correctly. The fault is in the bag, which has no small dogs.
      - type: matching
        id: was-fehlt
        text:
          de: Diese Fälle sind erfunden. Welche Beispiele fehlen in den Trainingsdaten?
          en: These cases are made up. Which examples are missing from the training data?
        pairs:
          - left:
              {
                de: "Eine Foto-App erkennt Hunde im Schnee schlecht.",
                en: "A photo app is bad at recognising dogs in snow.",
              }
            right: { de: Hundefotos aus dem Winter, en: dog photos from winter }
          - left:
              {
                de: "Ein Sprachassistent versteht Kinder schlecht.",
                en: "A voice assistant is bad at understanding children.",
              }
            right: { de: Aufnahmen von Kinderstimmen, en: recordings of children's voices }
          - left:
              {
                de: "Ein Pflanzen-Erkenner erkennt Pflanzen ohne Blüten nicht.",
                en: "A plant app does not recognise plants without flowers.",
              }
            right: { de: Fotos von Pflanzen ohne Blüten, en: photos of plants without flowers }
          - left:
              {
                de: "Die Maschine des Tierheims hält kleine Hunde für Katzen.",
                en: "The shelter's machine thinks small dogs are cats.",
              }
            right: { de: Karten von kleinen Hunden, en: cards of small dogs }
        distractors:
          - { de: ein schnellerer Computer, en: a faster computer }
        hint:
          de: Frag bei jedem Fall, welche Situation das System nie als Beispiel gesehen hat.
          en: For each case, ask which situation the system never saw as an example.
        explanation:
          de: In jedem Fall fehlt eine Art von Beispielen.
          en: In each case one kind of example is missing.
      - type: ordering
        id: datenfehler-finden
        text:
          de: In welcher Reihenfolge findest und behebst du einen Fehler in den Trainingsdaten?
          en: In which order do you find and fix a fault in the training data?
        items:
          - { de: Falsch erkannte Beispiele sammeln, en: Collect the examples that were recognised wrongly }
          - { de: "Suchen, was diese Beispiele gemeinsam haben", en: "Look for what these examples have in common" }
          - {
              de: "Prüfen, ob solche Beispiele in den Trainingsdaten fehlen",
              en: "Check whether examples like them are missing from the training data",
            }
          - { de: Fehlende Beispiele ergänzen und neu testen, en: Add the missing examples and test again }
        hint:
          de: Erst brauchst du die Fehler, dann ihr Muster, dann den Blick in die Daten.
          en: First you need the mistakes, then their pattern, then a look at the data.
        explanation:
          de: Erst das Muster der Fehler zeigt, welche Beispiele fehlen.
          en: Only the pattern of the mistakes shows which examples are missing.
      - type: multiple-choice
        id: was-ergaenzen
        text:
          de: Welche Karten machen den Beutel des Tierheims weniger einseitig?
          en: Which cards make the shelter's bag less one-sided?
        options:
          - text: { de: "Waldi, ein kleiner Hund", en: "Waldi, a small dog" }
            correct: true
            info:
              de: Mit Waldi gibt es im Beutel auch einen kleinen Hund.
              en: With Waldi there is also a small dog in the bag.
          - text: { de: "Tiger, eine große Katze", en: "Tiger, a big cat" }
            correct: true
            info:
              de: Mit Tiger gibt es auch eine große Katze. Größe trennt dann nicht mehr die Sorten.
              en: With Tiger there is also a big cat. Then size no longer separates the kinds.
          - text: { de: "Bella, ein großer Hund", en: "Bella, a big dog" }
            correct: false
            info:
              de: Große Hunde gibt es schon.
              en: There are already big dogs.
          - text: { de: "Mimi, eine kleine Katze", en: "Mimi, a small cat" }
            correct: false
            info:
              de: Kleine Katzen gibt es schon genug.
              en: There are already enough small cats.
        hint:
          de: "Gesucht sind Tiere, die das Muster „klein ist Katze, groß ist Hund“ brechen."
          en: "You are looking for animals that break the pattern “small means cat, big means dog”."
        explanation:
          de: Mehr Karten helfen nur, wenn sie zeigen, was im Beutel fehlt. Mehr von derselben Sorte macht es schlimmer.
          en: More cards only help if they show what is missing from the bag. More of the same makes it worse.
  - type: section
    id: rueckblick
    title:
      de: Rückblick
      en: Looking back
    blocks:
      - type: text
        text:
          de: |
            Die Auswahl der Trainingsdaten bestimmt, was ein lernendes System kann. Fehlen Beispiele, übernimmt es
            Zufälle der Auswahl als Muster und irrt immer wieder auf dieselbe Weise. **Was in den Beutel kommt, bestimmt,
            was herauskommt.**
          en: |
            The choice of training data decides what a learning system can do. If examples are missing, it takes on
            chance features of the choice as patterns and keeps getting things wrong in the same way. **What goes into
            the bag decides what comes out.**
