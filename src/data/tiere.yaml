# Die Tierkarten des Trainingsbeutels: erfundene, gezeichnete Tiere aus dem Tierheim. Jede Karte gibt es nur hier.
# Merkmale mit je zwei Werten, 1 ist der Wert, den auf unseren Karten die meisten Katzen haben:
#   ohren 1 spitz, 0 hängend; schnauze 1 kurz, 0 lang; groesse 1 klein, 0 groß; pupille 1 schmal, 0 rund.
# katze: das Etikett der Karte, 1 Katze, 0 Hund. merkmale: die vier Merkmale als Text, in derselben Reihenfolge; sie
# müssen zu den Zahlen passen. fell: Nummer der Fellfarbe in FELL von TierBild.ts. Namen bleiben in jeder Sprache gleich.
- name:
    de: Luna
    en: Luna
  katze: 1
  ohren: 1
  schnauze: 1
  groesse: 1
  pupille: 1
  merkmale:
    de: "spitze Ohren, kurze Schnauze, klein, schmale Pupillen"
    en: "pointed ears, short snout, small, narrow pupils"
  fell: 0
